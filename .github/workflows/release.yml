name: release

on:
    release:
        types: [published]

permissions:
    contents: write

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Check out the code
              uses: actions/checkout@v4

            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Install PHP dependencies
              run: composer install --no-dev --optimize-autoloader --no-interaction

            - name: Install Node dependencies
              run: npm install

            - name: Build the plugin
              run: npm run build

            - name: Create the ZIP
              run: zip -r ${{ github.event.repository.name }}.${{ github.ref_name }}.zip ${{ github.event.repository.name }}

            - name: Attach the ZIP to the release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: gh release upload "${{ github.ref_name }}" "${{ github.event.repository.name }}.${{ github.ref_name }}.zip" --clobber
